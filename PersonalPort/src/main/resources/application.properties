# ===================================================================
# Vikash Pandey - Java Developer Portfolio Configuration
# ===================================================================

spring.application.name=vikash-portfolio

# Server Configuration (Configurable via PORT environment variable)
server.port=${PORT:8088}

# Database Configuration (MySQL 8)
# Can be overridden via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vikash_portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring MVC & Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart / File Upload Size Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Initial Administrator Credentials (Configurable via ENV)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@Vikash2026!}
app.admin.email=${ADMIN_EMAIL:admin@vikashpandey.dev}

# Mail Configuration (Optional - enabled via ENABLE_EMAIL_NOTIFICATION=true)
app.mail.enabled=${ENABLE_EMAIL_NOTIFICATION:false}
app.mail.receiver=${PORTFOLIO_OWNER_EMAIL:vikashpandey.dev@gmail.com}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.vikash.portfolio=INFO
logging.level.org.springframework.security=WARN
