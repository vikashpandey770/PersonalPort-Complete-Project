<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Administrator Login')}"></head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 mb-2">
                    <span class="brand-badge">VP</span>
                    <span class="fs-4 fw-bold text-white">Vikash Pandey</span>
                </a>
                <p class="text-muted small">Portfolio Administration Portal</p>
            </div>

            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-dark bg-opacity-50 text-info mb-2 border border-secondary border-opacity-25">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h1 class="h4 text-white">Admin Sign In</h1>
                    <p class="text-secondary small">Access the hiring inquiry management dashboard</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${errorMessage}">Invalid credentials</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${logoutMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i>
                    <span th:text="${logoutMessage}">Logged out</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Admin Login Form -->
                <form th:action="@{/admin/login}" method="post">
                    <!-- CSRF Token (handled automatically by Thymeleaf th:action) -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control form-control-custom" id="username" name="username"
                                   placeholder="Enter admin username" required autofocus autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" class="form-control form-control-custom" id="password" name="password"
                                   placeholder="Enter password" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>

                    <div class="text-center">
                        <a th:href="@{/}" class="text-secondary small text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Return to Portfolio
                        </a>
                    </div>
                </form>
            </div>

            <div class="text-center mt-4">
                <small class="text-muted">Protected by Spring Security with BCrypt &amp; CSRF</small>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
