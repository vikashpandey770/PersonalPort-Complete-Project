<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="mt-auto">
    <div class="container text-center">
        <div class="row align-items-center gy-3">
            <div class="col-md-4 text-md-start">
                <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2">
                    <span class="brand-badge" style="width: 30px; height: 30px; font-size: 0.85rem;">VP</span>
                    <span class="text-white fw-bold">Vikash Pandey</span>
                </div>
                <small class="text-muted d-block mt-1">Java Developer & Spring Boot Specialist</small>
            </div>

            <div class="col-md-4 text-center">
                <p class="mb-0 text-muted small">
                    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Vikash Pandey. All rights reserved.
                </p>
                <small class="text-muted">Built with Spring Boot 3 & Thymeleaf</small>
            </div>

            <div class="col-md-4 text-md-end">
                <div class="social-links justify-content-center justify-content-md-end">
                    <a href="https://github.com/vikashpandey770" target="_blank" rel="noopener noreferrer"
                       class="social-btn" title="GitHub Profile" aria-label="GitHub">
                        <i class="bi bi-github"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/vikash-p-2532aa258/" target="_blank" rel="noopener noreferrer"
                       class="social-btn" title="LinkedIn Profile" aria-label="LinkedIn">
                        <i class="bi bi-linkedin"></i>
                    </a>
                    <a th:href="@{/admin/login}" class="social-btn" title="Admin Portal" aria-label="Admin Portal">
                        <i class="bi bi-shield-lock-fill"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Top Floating Button -->
    <button id="backToTopBtn" title="Back to top" aria-label="Scroll to top">
        <i class="bi bi-chevron-up"></i>
    </button>

    <!-- Bootstrap 5.3.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Main JS -->
    <script th:src="@{/js/main.js}"></script>
</footer>
</body>
</html>
