<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Application Error')}"></head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center text-center p-4">

<div class="glass-panel p-5 text-center" style="max-width: 520px;">
    <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-25 text-warning mb-3">
        <i class="bi bi-exclamation-octagon-fill display-4"></i>
    </div>
    <h1 class="h3 text-white mb-2">Something Went Wrong</h1>
    <p class="text-secondary mb-4">
        An unexpected error occurred while processing your request. Please return to the portfolio home or contact the administrator if this issue persists.
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-primary-gradient">
            <i class="bi bi-house-door me-1"></i> Return to Portfolio
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
