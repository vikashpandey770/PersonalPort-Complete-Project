<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('403 - Access Denied')}"></head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center text-center p-4">

<div class="glass-panel p-5 text-center" style="max-width: 500px;">
    <div class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-25 text-danger mb-3">
        <i class="bi bi-shield-slash-fill display-4"></i>
    </div>
    <h1 class="h3 text-white mb-2">403 - Access Denied</h1>
    <p class="text-secondary mb-4">
        You do not have the required administrator privileges to view or modify this resource.
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-outline-custom">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
        <a th:href="@{/admin/login}" class="btn btn-primary-gradient">
            <i class="bi bi-box-arrow-in-right me-1"></i> Admin Login
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
