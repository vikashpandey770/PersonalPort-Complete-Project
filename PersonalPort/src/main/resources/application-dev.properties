# ===================================================================
# Development Profile: In-Memory Database (No local MySQL required)
# Activate via: --spring.profiles.active=dev
# ===================================================================

spring.datasource.url=jdbc:h2:mem:vikash_portfolio_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin User Credentials for Dev
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@Vikash2026!}
app.admin.email=${ADMIN_EMAIL:admin@vikashpandey.dev}

# Mail disabled in dev profile
app.mail.enabled=false
